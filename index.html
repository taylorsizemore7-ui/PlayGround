<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sunday Thunder</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07090d;font-family:Impact,"Arial Black",sans-serif;color:#fff;touch-action:none}#game{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hud{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;background:rgba(8,12,18,.88);border:1px solid rgba(255,255,255,.12);padding:8px 14px 7px;box-shadow:0 8px 30px #0008}.brand{font-size:14px;letter-spacing:2px;color:#f2c94c}.stat{text-align:center;min-width:62px}.stat b{display:block;font-family:Arial,sans-serif;font-size:21px;font-weight:900}.stat span{display:block;font-family:Arial,sans-serif;font-size:8px;letter-spacing:1.5px;color:#9da9b6}.place{color:#55b7ff}.lapbox{border-left:1px solid #ffffff22;border-right:1px solid #ffffff22;padding:0 13px}.position{position:absolute;right:22px;top:22px;width:190px;background:rgba(8,12,18,.8);padding:9px 12px}.position div{display:flex;justify-content:space-between;font-family:Arial,sans-serif;font-size:11px;margin:5px 0}.position i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}.speed{position:absolute;bottom:28px;right:28px;width:150px;height:150px;border:3px solid #fff2;border-radius:50%;background:radial-gradient(circle,#10151ce8 0 58%,#0a0d12 59%);text-align:center;padding-top:40px}.speed strong{display:block;font-family:Arial,sans-serif;font-size:39px;line-height:38px}.speed span{font-family:Arial,sans-serif;font-size:9px;letter-spacing:2px;color:#adb6bf}.tach{position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;border-top-color:#f0c13d;border-right-color:#e74747}.controls{position:absolute;inset:0;pointer-events:none}.pedal,.steer{pointer-events:auto}.pedal{position:absolute;bottom:28px;width:88px;height:88px;border-radius:50%;border:2px solid #ffffff44;color:#fff;text-align:center;padding-top:32px;font-family:Arial,sans-serif;font-weight:900;font-size:11px;background:#111722cc;box-shadow:0 6px 20px #0007}.brake{left:28px}.gas{left:128px}.steer{position:absolute;bottom:28px;right:28px;width:150px;height:150px;border-radius:50%;opacity:.001}.controls-mobile{display:none}@media(max-width:700px),(pointer:coarse){.topbar{top:10px;gap:7px;width:calc(100% - 20px);justify-content:space-around}.brand{display:none}.stat{min-width:48px}.stat b{font-size:17px}.position{display:none}.speed{bottom:118px;right:10px;width:94px;height:94px;padding-top:23px}.speed strong{font-size:26px}.controls-mobile{display:block}.pedal{width:76px;height:76px;bottom:20px}.brake{left:18px}.gas{left:104px}.steer{display:block;width:130px;height:130px;bottom:12px;right:12px}.desktopHint{display:none}}
#countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;color:#f7cf45;text-shadow:0 8px 30px #000;pointer-events:none}.notice{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) skew(-8deg);font-size:32px;letter-spacing:4px;color:#fff;text-shadow:3px 3px 0 #c62828;opacity:0}.notice.show{animation:notice 1.8s}.desktopHint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-size:10px;color:#b4bdc7;background:#080b10aa;padding:7px 10px}@keyframes notice{0%{opacity:0;transform:translate(-50%,-50%) scale(.7) skew(-8deg)}15%,70%{opacity:1;transform:translate(-50%,-50%) scale(1) skew(-8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) skew(-8deg)}}
#overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#1c2735ee,#080a0e 72%);display:flex;align-items:center;justify-content:center;z-index:5}.panel{text-align:center}.panel h1{font-size:clamp(58px,10vw,120px);line-height:.82;margin:0;text-transform:uppercase;letter-spacing:-5px}.panel h1 em{display:block;color:#f1c33d;font-style:normal}.panel p{font-family:Arial,sans-serif;color:#bbc4ce;letter-spacing:3px;font-size:12px}.panel button{margin-top:22px;border:0;background:#e8bd39;color:#111;font-family:Arial,sans-serif;font-weight:900;font-size:14px;padding:16px 36px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);cursor:pointer}.panel button:hover{background:#fff}.hidden{display:none!important}
</style></head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="topbar"><div class="brand">SUNDAY<br>THUNDER</div><div class="stat place"><b id="place">1ST</b><span>POSITION</span></div><div class="stat lapbox"><b id="lap">1 / 5</b><span>LAP</span></div><div class="stat"><b id="time">00:00.000</b><span>RACE TIME</span></div></div><div class="position"><div><span><i style="background:#f1c33d"></i>YOU</span><b id="pGap0">LEAD</b></div><div><span><i style="background:#e54845"></i>#18 WOOD</span><b id="pGap1">+0.2</b></div><div><span><i style="background:#4eb8ef"></i>#7 KLEIN</span><b id="pGap2">+0.8</b></div><div><span><i style="background:#84bd5b"></i>#41 ROSS</span><b id="pGap3">+1.4</b></div></div><div class="speed"><div class="tach" id="tach"></div><strong id="speed">0</strong><span>MPH</span></div><div id="notice" class="notice">GREEN FLAG</div><div id="countdown"></div><div class="desktopHint">WASD / ARROWS to drive &nbsp;•&nbsp; C to change camera</div></div>
<div class="controls"><div class="controls-mobile"><div class="pedal brake" id="brake">BRAKE</div><div class="pedal gas" id="gas">GAS</div><div class="steer" id="steer"></div></div></div>
<div id="overlay"><div class="panel"><h1>SUNDAY<em>THUNDER</em></h1><p>DAYTONA OVAL · 5 LAP SPRINT</p><button id="start">START ENGINE</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let keys={},touch={gas:false,brake:false,steer:0},running=false,counting=false,finished=false,startTime=0,camera=0;
const state={x:0,y:0,angle:0,speed:0,lap:1,progress:0};
const cars=[{progress:.985,color:'#e54845',lane:-22,speed:.000018},{progress:.97,color:'#4eb8ef',lane:-52,speed:.000017},{progress:.955,color:'#84bd5b',lane:-4,speed:.000019}];
addEventListener('keydown',e=>{keys[e.key.toLower]=true;if(e.key.toLowerCase()=='c')camera=(camera+1)%3;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLower]=false);
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.prevent();touch[key]=true;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>touch[key]=false);el.addEventListener('pointercancel',()=>touch[key]=false)}bind('gas','gas');bind('brake','brake');
let steerEl=document.getElementById('steer');steerEl.addEventListener('pointermove',e=>{let r=steerEl.getBoundingRect();touch.steer=(e.clientX-(r.left+r.width/2))/(r.width/2)});steerEl.addEventListener('pointerdown',e=>{steerEl.setPointerCapture(e.pointerId);let r=steerEl.getBoundingRect();touch.steer=(e.clientX-(r.left+r.width/2))/(r.width/2)});steerEl.addEventListener('pointerup',()=>touch.steer=0);
function ovalPoint(t,lane=0){let rx=420-lane*.15,ry=190-lane*.25,tw=0.5*(Math.cos(t)+1);let cx=W/2+(camera==2?Math.sin(state.progress*Math.PI*2)*30:0),cy=H*.56;return{x:cx+Math.cos(t)*rx,y:cy+Math.sin(t)*ry}}
function project(x,y,z=0){let s=camera==1?1.1:camera==2?.92:1;let cx=W/2,cy=H*.58;return{x:cx+(x-cx)*s,y:cy+(y-cy)*s+(camera==1?90:camera==2?-10:0)}}
function drawOval(){let cx=W/2,cy=H*.56,scale=Math.min(W/1100,H/720);ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);ctx.translate(-cx,-cy);
ctx.fillStyle='#5b8b37';ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#648f3d':'#5a8835';ctx.fillRect(0,i*H/9,W,H/9)}
ctx.beginPath();for(let t=0;t<=Math.PI*2+.03;t+=.03){let p=ovalPoint(t,0);if(t==0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.fillStyle='#20252a';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#dcd9ce';ctx.stroke();ctx.beginPath();for(let t=0;t<=Math.PI*2+.03;t+=.03){let p=ovalPoint(t,-70);if(t==0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.strokeStyle='#e5ecef';ctx.lineWidth=2;ctx.stroke();for(let lane of [-18,-38,-58]){ctx.beginPath();for(let t=0;t<=Math.PI*2+.03;t+=.03){let p=ovalPoint(t,lane);if(t==0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.strokeStyle='#ffffff18';ctx.lineWidth=1;ctx.stroke()}ctx.restore();}
function drawRoadMarks(){ctx.save();let cx=W/2,cy=H*.56;ctx.translate(cx,cy);ctx.rotate(-.02);ctx.translate(-cx,-cy);ctx.font='900 22px Arial';ctx.fillStyle='#e8edf1';ctx.textAlign='center';ctx.fillText('START / FINISH',cx,cy-190);ctx.fillStyle='#fff';ctx.fillRect(cx-2,cy-180,4,28);ctx.restore();}
function drawCar(p,color,xplayer=false){ctx.save();ctx.translate(p.x,p.y);let heading=Math.atan2(Math.cos(state.angle)*H*.0001,1);if(!xplayer){heading=0}else heading=state.angle-.5*Math.PI;ctx.rotate(heading);ctx.fillStyle='#111';ctx.fillRect(-17,-8,34,16);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-19,-11,38,22,5);ctx.fill();ctx.fillStyle='#dce5e7';ctx.fillRect(-6,-10,12,20);ctx.fillStyle='#20262c';ctx.fillRect(-13,-8,26,16);ctx.fillStyle=color;ctx.fillRect(-15,-12,30,24);ctx.fillStyle='#101010';ctx.fillRect(-20,-10,5,7);ctx.fillRect(15,-10,5,7);ctx.fillRect(-20,3,5,7);ctx.fillRect(15,3,5,7);ctx.fillStyle='#fff';ctx.font='900 7px Arial';ctx.textAlign='center';ctx.fillText(xplayer?'3':'18',0,3);ctx.restore();}
function roadView(){let base=camera==1?-28:camera==2?8:0;ctx.save();ctx.translate(0,base);drawOval();drawRoadMarks();let player=ovalPoint(state.progress*Math.PI*2,state.x);if(camera==0||camera==2){player=project(player.x,player.y);drawCar(player,'#f1c33d',true)}for(let i=0;i<cars.length;i++){let c=cars[i],p=ovalPoint(c.progress*Math.PI*2,c.lane);let q=project(p.x,p.y);drawCar(q,c.color,false)}ctx.restore();}
function render(){ctx.clearRect(0,0,W,H);roadView();let shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#8fd0d322');shade.addColorStop(.7,'#0000');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H)}
function update(dt){if(!running)return;let gas=keys.w||keys.arrowup||touch.gas,brake=keys.s||keys.arrowdown||touch.brake,steer=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0)+touch.steer;if(gas)state.speed+=0.000035*dt;if(brake)state.speed-=0.000055*dt;state.speed-=0.000008*dt;state.speed=Math.max(0,Math.min(.00019,state.speed));state.progress=(state.progress+state.speed*dt)%(1*1);state.x+=steer*state.speed/dt*13*dt*.0008;if(state.x<-75)state.x=-75;if(state.x>75)state.x=75;let newLap=Math.floor(state.progress*5)+1;if(newLap>5){finished=true;running=false;finishRace()}state.lap=newLap;for(let c of cars){c.progress=(c.progress+c.speed*dt)%1}let mph=Math.round(state.speed/.00019*195);document.getElementById('speed').textContent=mph;document.getElementById('lap').textContent=state.lap+' / 5';document.getElementById('tach').style.transform='rotate('+(-100+mph*.9)+'deg)';let secs=(performance.now()-startTime)/1000;document.getElementById('time').textContent=format(secs)}
function format(s){let m=Math.floor(s/60),r=s-m*60;return String(m).padStart(2,'0')+':'+r.toFixed(3).padStart(6,'0')}
function loop(now){let dt=Math.min(now-(loop.last||now),32);loop.last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function startCountdown(){document.getElementById('overlay').classList.add('hidden');let n=3;let cd=document.getElementById('countdown');cd.textContent=n;let timer=setInterval(()=>{n--;if(n>0)cd.textContent=n;else if(n==0){cd.textContent='';clearInterval(timer);running=true;startTime=performance.now();let notice=document.getElementById('notice');notice.textContent='GREEN FLAG';notice.classList.remove('show');void notice.offsetWidth;notice.classList.add('show')}else{}},1000)}
function finishRace(){document.querySelector('.panel h1').innerHTML='RACE<em>FINISHED</em>';document.querySelector('.panel p').textContent='FINAL TIME · '+format((performance.now()-startTime)/1000);document.querySelector('.panel button').textContent='RACE AGAIN';document.getElementById('overlay').classList.remove('hidden')}
document.getElementById('start').onclick=()=>{if(finished){location.reload()}else startCountdown()};
</script></body></html>
